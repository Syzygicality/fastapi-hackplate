services:
  api:
    build: .
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Keycloak runs as its own compose project (`hackplate keycloak up`), so it
      # is reached through the port it publishes on the host. Add `127.0.0.1
      # keycloak` to your /etc/hosts so KEYCLOAK_URL resolves here too.
      - "keycloak:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  api-prod:
    build: .
    profiles: [prod]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak:host-gateway"
